---
# Publishes fork builds from `main-local`, the branch that carries this fork's
# own work on top of upstream. See LOCAL-RELEASES.md for the branch model.
#
# The tag prefix is what keeps this separate from upstream's release.yml, which
# this branch also carries and which fires on `v*.*.*`. A `fork-v0.25.1` tag
# matches only the filter below, so cutting a fork build never starts an
# upstream release run alongside it.
name: Local Release
on:
  push:
    tags:
      - "fork-v*"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # A fork build that fails its tests is worse than no build, since it gets
  # installed unattended from the release page. The release job waits on this.
  #
  # `lint.yml` also runs on a tag push and covers the same ground, but a
  # separate workflow cannot gate this one. Tests that decide whether a release
  # is published have to run inside it.
  test:
    name: test
    runs-on: ubuntu-latest
    # Compiling dependencies and running tests never needs to write to the
    # repository. Only the release job below gets a token that can.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - uses: jcbhmr/setup-wasmtime@960c367a99921eb0b02f5778fce9ae8f110bf0f0 # v2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4f647fc679bcd3b11499ccb42104547c83dabe96 # stable
        with:
          toolchain: "1.95.0"
          target: wasm32-wasip1

      - name: Install cargo-nextest
        run: cargo install --locked cargo-nextest

      # `--bins` matters here rather than in lint.yml: this run gates
      # publication, and src/bin/zjstatus.rs carries tests of plugin state that
      # ships inside zjstatus.wasm.
      - name: Run tests
        run: cargo nextest run --lib --bins

  release:
    name: release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    env:
      WASI_SDK_PATH: /opt/wasi-sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          # Fetches every branch and tag, which git-cliff needs for the
          # changelog and the step below needs to resolve origin/main*.
          fetch-depth: 0

      # The release notes claim this artifact is a fork build. Two ways to tag
      # something that is not: a commit that never reached main-local (an
      # unmerged work branch, or main-local not yet pushed), or a commit on
      # main, which is a pure mirror of upstream and carries no fork work at
      # all. Reject both before anything is built or published.
      - name: Verify the tag carries fork work
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"

          for ref in origin/main origin/main-local; do
            git rev-parse --verify --quiet "refs/remotes/${ref}" >/dev/null || {
              echo "::error::${ref} is missing from this checkout, so ${tag} cannot be verified."
              exit 1
            }
          done

          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main-local; then
            echo "::error::${tag} points at ${GITHUB_SHA}, which is not on origin/main-local. Push main-local first, then push the tag."
            exit 1
          fi

          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${tag} points at ${GITHUB_SHA}, which is on main and so carries no fork work. Tag a commit on main-local instead."
            exit 1
          fi

      # Upstream's tags live under refs/upstream-tags/, where sync-upstream.yml
      # puts them to keep the fork's tag list to fork releases alone. The
      # checkout above fetches refs/tags/ only, so without this git-cliff would
      # see no tag before this one and scope the notes to all of history.
      - name: Restore upstream tags for the changelog
        run: git fetch --quiet origin "+refs/upstream-tags/*:refs/tags/*"

      - name: Install WASI SDK
        run: |
          wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-20/wasi-sdk-20.0-linux.tar.gz
          tar -xzf wasi-sdk-20.0-linux.tar.gz
          mv wasi-sdk-20.0 /opt/wasi-sdk

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4f647fc679bcd3b11499ccb42104547c83dabe96 # stable
        with:
          toolchain: "1.95.0"
          target: wasm32-wasip1

      # The target comes from .cargo/config.toml, which pins wasm32-wasip1.
      - name: Build release binaries
        run: cargo build --release

      - name: Generate a changelog
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v3
        id: git-cliff
        with:
          # The fork's own config, not upstream's cliff.toml. A copy of it
          # differing only in that the section headings are plain words, kept
          # separate so upstream's file stays byte-identical and merges cleanly.
          config: cliff-fork.toml
          # Pinned so that bumping the action's SHA cannot quietly change which
          # commits a release's notes cover.
          version: "v2.13.1"
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md

      # The release page is the only place a reader sees these artifacts, so it
      # has to say plainly whose build this is and exactly what went into it.
      - name: Compose release notes
        run: |
          set -euo pipefail
          {
            echo "Fork build from \`main-local\`. Not an upstream zjstatus release."
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`${GITHUB_REF#refs/tags/}\` |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| Built | $(date -u '+%Y-%m-%d %H:%M UTC') |"
            echo
            cat CHANGES.md
          } > RELEASE_NOTES.md

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          # Published rather than draft: pushing the tag is meant to be the last
          # manual step, and these builds are installed straight from the
          # release page.
          draft: false
          prerelease: false
          files: |
            ./target/wasm32-wasip1/release/zjstatus.wasm
            ./target/wasm32-wasip1/release/zjframes.wasm
